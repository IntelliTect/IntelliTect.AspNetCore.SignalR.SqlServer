on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Test_Passw0rd!
        ports:
        - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Test_Passw0rd!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SIGNALR_TESTS_SQLSERVER: Server=localhost;User Id=sa;Password=Test_Passw0rd!;TrustServerCertificate=True
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: | 
          8.0.x
          10.0.x
          11.0.x
    - name: Build
      run: dotnet build --configuration Release
    - name: Test
      run: dotnet test --configuration Release --no-build
